<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="style.css" />
        <title>frontend</title>
    </head>

    <body>
        <div id="root"></div>
        <script
            type="module"
            src="/src/main.jsx"></script>

        <div class="carousel">
            <btn class="carousel__arrow carousel__arrow--left"><</btn>
            <img
                class="carousel__image"
                src="src/images/EV-charging.png" />
            <btn class="carousel__arrow carousel__arrow--left">></btn>
        </div>

        <div class="grid--feature">
            <div class="grid__item">
                Item 1
                <img src="src/images/EV-charging.png" />
            </div>
            <div class="grid__item">
                Item 2
                <img src="src/images/close-up-EV-charging.jpg" />
            </div>
            <div class="grid__item grid__item--wide">
                Item 3
                <img src="src/images/EV-fast.png" />
            </div>
        </div>

        <div class="c_buttons">
            <button class="c-button c-button--primary">
                Primary. This button is the most important button
            </button>
            <button class="c-button c-button--large">Secondary</button>
            <button class="c-button c-button--outline">
                This Button is Outlined
            </button>
            <button class="c-button c-button--delete">Delete</button>
        </div>
    </body>
</html>
